name: securo
description: "Securo — self-hosted personal finance, on your phone."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Networking
  dio: ^5.7.0

  # Models
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Routing
  go_router: ^14.6.2

  # Secure storage + biometrics
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0

  # OIDC / passkey handoff via Chrome Custom Tabs
  # UI
  google_fonts: ^6.2.1
  fl_chart: ^0.69.2
  intl: ^0.19.0
  flutter_svg: ^2.0.16
  shared_preferences: ^2.3.3
  file_picker: ^11.0.3
  url_launcher: ^6.3.1
  app_links: ^7.2.1
  passkeys: ^2.22.3
  flutter_bloc: ^9.1.1
  bloc_concurrency: ^0.3.0
  stream_transform: ^2.1.1
  lucide_icons_flutter: ^3.1.17
  collection: ^1.19.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  flutter_launcher_icons: ^0.14.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: "ic_launcher"
  image_path: "assets/images/icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/icon_foreground.png"
  min_sdk_android: 23
